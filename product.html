<script>
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id') || NANJAWI_PRODUCTS[0].id;
  const product = getProductById(id) || NANJAWI_PRODUCTS[0];
  let qty = 1;

  document.title = `${product.name} | ننجاوي`;
  document.getElementById('breadcrumb').innerHTML =
    `<a href="majlis.html">مجلس الصوت</a> / <a href="shop.html">المتجر</a> / ${product.name}`;

  document.getElementById('pd-container').innerHTML = `
    <div class="pd-gallery">
      <div class="pd-gallery-main">${product.icon}</div>
      <div class="pd-thumbs">
        <div class="active">${product.icon}</div>
        <div>🌿</div>
        <div>📦</div>
      </div>
    </div>
    <div class="pd-info">
      <span class="product-cat">${product.category}</span>
      <h1>${product.name}</h1>
      <div class="pd-rating">★★★★★ <span style="color:var(--muted)">(128 تقييم)</span></div>
      <div class="pd-price">${formatPrice(product.price)} ر.س</div>
      <p class="pd-desc">${product.desc}</p>

      <div class="qty-row">
        <div class="qty-control">
          <button id="qty-plus">+</button>
          <span id="qty-value">1</span>
          <button id="qty-minus">−</button>
        </div>
        <span style="color:var(--muted); font-size:14px;">الكمية المتوفرة: 24 قطعة</span>
      </div>

      <div class="pd-actions">
        <button class="btn btn-primary" id="add-to-cart-btn" style="flex:1;">أضف إلى السلة</button>
        <a href="cart.html" class="btn btn-outline">عرض السلة</a>
      </div>

      <div class="pd-meta">
        <div><span>الفئة</span><span>${product.category}</span></div>
        <div><span>الشحن</span><span>يصل خلال 2-4 أيام عمل</span></div>
        <div><span>الإرجاع</span><span>خلال 7 أيام من الاستلام</span></div>
      </div>
    </div>
  `;

  document.getElementById('qty-plus').addEventListener('click', () => {
    qty += 1;
    document.getElementById('qty-value').textContent = qty;
  });
  document.getElementById('qty-minus').addEventListener('click', () => {
    qty = Math.max(1, qty - 1);
    document.getElementById('qty-value').textContent = qty;
  });
  document.getElementById('add-to-cart-btn').addEventListener('click', () => {
    addToCart({ id: product.id, name: product.name, price: product.price, icon: product.icon, category: product.category }, qty);
  });

  const related = NANJAWI_PRODUCTS.filter(p => p.category === product.category && p.id !== product.id).slice(0, 4);
  renderProductGrid(document.getElementById('related-grid'), related.length ? related : NANJAWI_PRODUCTS.slice(0, 4));
</script>
