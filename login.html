<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول | ننجاوي</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-panel">
    <a href="index.html" class="brand"><span class="brand-mark"></span><span class="kufi">ننجاوي</span></a>
    <div class="auth-quote">
      <p class="big">"كل قطعة عود تحمل حكاية أرض، وكل عطر يحمل ذكرى مجلس."</p>
      <p class="by">— من فلسفة ننجاوي</p>
    </div>
    <div></div>
  </div>

  <div class="auth-form-side">
    <div class="auth-box">
      <h1>مرحباً بعودتك</h1>
      <p class="sub">سجّل الدخول لمتابعة طلباتك والاستفادة من عروضك الخاصة</p>

      <form id="login-form" novalidate>
        <div class="field" id="login-email-field">
          <label for="login-email">البريد الإلكتروني</label>
          <input type="email" id="login-email" placeholder="example@nanjawi.com" required>
          <span class="field-error">يرجى إدخال بريد إلكتروني صحيح</span>
        </div>

        <div class="field" id="login-password-field">
          <label for="login-password">كلمة المرور</label>
          <input type="password" id="login-password" placeholder="••••••••" required>
          <span class="field-error">كلمة المرور يجب ألا تقل عن 6 أحرف</span>
        </div>

        <div class="field-row">
          <label class="remember"><input type="checkbox"> تذكرني</label>
          <a href="#" class="link-muted">نسيت كلمة المرور؟</a>
        </div>

        <button type="submit" class="btn btn-primary btn-block">تسجيل الدخول</button>
      </form>

      <div class="divider">أو تابع عبر</div>
      <div class="social-row">
        <button class="social-btn">Google</button>
        <button class="social-btn">Apple</button>
      </div>

      <p class="auth-switch">ليس لديك حساب؟ <a href="register.html" class="link-muted">أنشئ حساباً جديداً</a></p>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
